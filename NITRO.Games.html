<button class="img-btn-custom size-md" type="button">
  <img src="GTA_5.jpg" alt="Medium Button">
</button>
<style>
  /* Base structural styles */
  .img-btn-custom {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-block;
    transition: transform 0.2s;
  }
  
  /* Forces the image to perfectly scale to the button's width */
  .img-btn-custom img {
    width: 100%;
    height: 25%;
    display: block;
  }

  .img-btn-custom:hover { transform: scale(1.03); }
  .img-btn-custom:active { transform: scale(0.98); }

  /* --- SIZE ADJUSTMENTS --- */
  .size-md { width: 180px; }
</style><a>
